<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/gif" href="{{ '/assets/img/anon.gif' | relative_url }}">
  <title>{{ page.title }} | OSINT Portfolio – kbaa</title>

  <!-- SEO -->
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title }} | OSINT Portfolio – kbaa">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ site.url }}{{ '/assets/img/oso1.png' | relative_url }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Theme init: inline to avoid flash -->
  <script>
    (function() {
      var t = localStorage.getItem('theme') ||
              (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <!-- Fonts: display=swap evita bloqueo de render -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       VARIABLES
    ============================================================ */
    :root {
      --bg-body: #1a0a0a;
      --bg-primary: #1f0d0d;
      --bg-primary-rgb: 31, 13, 13;
      --bg-secondary: #2a1010;
      --text-body: #c9a0a0;
      --text-primary: #f5e0e0;
      --text-secondary: #8a5a5a;
      --accent-primary: #cc2222;
      --accent-hover: #ff3333;
      --border-color: #3d1515;
      --highlight-bg: #2a0f0f;
      --shadow-color: rgba(180,0,0,0.15);
    }
    [data-theme="dark"] {
      --bg-body: #0a0000;
      --bg-primary: #110000;
      --bg-primary-rgb: 17, 0, 0;
      --bg-secondary: #1a0505;
      --text-body: #b08080;
      --text-primary: #f5e0e0;
      --text-secondary: #6b3a3a;
      --accent-primary: #e02020;
      --accent-hover: #ff4444;
      --border-color: rgba(200,30,30,0.2);
      --highlight-bg: rgba(17,0,0,0.9);
      --shadow-color: rgba(200,0,0,0.3);
    }

    /* ============================================================
       RESET
       Nota: transition global en * es muy costoso en CPU.
       Solo aplicamos donde realmente hace falta.
    ============================================================ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Solo el fondo y bordes necesitan transición global */
    html {
      scroll-behavior: smooth;
      background-color: var(--bg-body);
      /* Evitar transición de bg en todo el DOM */
      transition: background-color 0.3s ease;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      color: var(--text-body);
      line-height: 1.6;
      font-size: 16px;
      /* Mejora subpixel rendering */
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeSpeed;
    }

    /* ============================================================
       SCROLLBAR
    ============================================================ */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--accent-primary);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-hover); }
    * { scrollbar-width: thin; scrollbar-color: var(--accent-primary) transparent; }

    /* ============================================================
       TIPOGRAFÍA
    ============================================================ */
    h1, h2, h3, h4 {
      color: var(--text-primary);
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 1rem;
    }
    h1 { font-size: clamp(2rem, 5vw, 3.5rem); }
    h2 { font-size: clamp(1.5rem, 4vw, 2.5rem); margin-top: 2rem; }
    h3 { font-size: clamp(1.25rem, 3vw, 1.75rem); }
    h4 { font-size: clamp(1.1rem, 2vw, 1.4rem); }

    p { margin-bottom: 1rem; color: var(--text-secondary); }

    a {
      color: var(--accent-primary);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    a:hover { color: var(--accent-hover); text-decoration: underline; }

    /* ============================================================
       LAYOUT
    ============================================================ */
    .container {
      max-width: 1200px;
      width: 92%;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: clamp(1.5rem, 3vw, 2rem);
      margin: 2rem auto;
      max-width: 1100px;
    }

    section { padding: 4rem 0; }
    section h2 { text-align: center; margin-bottom: 3rem; }

    /* ============================================================
       HEADER
       backdrop-filter solo en dark: en light no aporta y es costoso
    ============================================================ */
    header {
      background: rgba(var(--bg-primary-rgb), 0.92);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px var(--shadow-color);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    [data-theme="dark"] header {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(13,17,23,0.75);
    }

    header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: 1;
    }

    .logo-group a {
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .profile-pic {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-primary);
      /* will-change permite al browser preparar la GPU */
      will-change: transform;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .logo-group a:hover .profile-pic {
      transform: scale(1.1);
      box-shadow: 0 0 12px var(--accent-primary);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      position: relative;
    }
    .logo::after {
      content: '';
      position: absolute;
      top: 2px;
      right: -10px;
      width: 6px;
      height: 6px;
      background: #ff2222;
      border-radius: 50%;
      box-shadow: 0 0 6px #ff2222;
      animation: pulseGlow 2s ease-in-out infinite alternate;
      /* Usar transform en lugar de opacity+scale para mejor perf */
      will-change: transform;
    }
    @keyframes pulseGlow {
      from { opacity: 0.5; transform: scale(0.8); }
      to   { opacity: 1;   transform: scale(1.2); }
    }

    nav {
      display: flex;
      gap: clamp(0.3rem, 1.5vw, 1.5rem);
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    nav a {
      white-space: nowrap;
      font-size: clamp(0.85rem, 1.5vw, 0.95rem);
      font-weight: 500;
      color: var(--text-secondary);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      transition: color 0.2s ease, background-color 0.2s ease;
      position: relative;
    }
    nav a:hover {
      color: var(--accent-primary);
      background: var(--bg-secondary);
      text-decoration: none;
    }
    nav a.active {
      color: var(--accent-primary);
      background: var(--bg-secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: 1;
      justify-content: flex-end;
    }

    .system-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #cc0000;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    /* En móvil escondemos el system status para ahorrar espacio */
    @media (max-width: 640px) { .system-status { display: none; } }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #cc0000;
      border-radius: 50%;
      box-shadow: 0 0 6px #cc0000;
      animation: statusPulse 2.5s ease-in-out infinite;
      will-change: opacity;
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .theme-toggle {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .theme-toggle:hover {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
    }
    .sun-text  { display: none; }
    [data-theme="dark"] .sun-text  { display: inline; }
    [data-theme="dark"] .moon-text { display: none; }

    /* ============================================================
       BACKGROUND GLOW
       Reducido: 2 blobs fijos, sin animación en dispositivos lentos
    ============================================================ */
    .bg-glow-container {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background: var(--bg-body);
      transition: background-color 0.3s ease;
    }
    .bg-glow-blob {
      position: absolute;
      width: 50vw;
      height: 50vw;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.12;
      /* Solo animar si el usuario no prefiere reducción de movimiento */
      animation: floatGlow 25s ease-in-out infinite alternate;
      will-change: transform;
    }
    @media (prefers-reduced-motion: reduce) {
      .bg-glow-blob { animation: none; }
      .hero-scanner { animation: none !important; }
      .logo::after  { animation: none !important; }
      .status-dot   { animation: none !important; }
      .pulse-dot    { animation: none !important; }
      .reveal       { opacity: 1 !important; transform: none !important; }
    }
    .bg-blob-1 { top: -25%; left: -25%; background: radial-gradient(circle, #cc0000, transparent); }
    .bg-blob-2 { bottom: -25%; right: -25%; background: radial-gradient(circle, #660000, transparent); animation-delay: -8s; }
    @keyframes floatGlow {
      0%   { transform: translate(0,0) scale(1); }
      100% { transform: translate(4%,4%) scale(1.08); }
    }

    /* ============================================================
       HERO
    ============================================================ */
    .hero {
      padding: clamp(3rem, 10vw, 6rem) 0 clamp(2rem, 8vw, 4rem);
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }
    /* Grid pattern: solo en dark para no añadir carga innecesaria en light */
    [data-theme="dark"] .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(220,30,30,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(220,30,30,0.04) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }
    .hero > * { position: relative; z-index: 1; }

    .hero-scanner {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(220,30,30,0.35), transparent);
      animation: heroScan 10s linear infinite;
      will-change: top;
      z-index: 0;
    }
    @keyframes heroScan {
      0%   { top: -2%; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { top: 102%; opacity: 0; }
    }

    .hero p {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--text-secondary);
      margin-bottom: 2rem;
      max-width: 750px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ============================================================
       BOTONES
    ============================================================ */
    .btn-primary, .btn-secondary {
      padding: 0.75rem 2rem;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      will-change: transform;
    }
    .btn-primary {
      background: var(--accent-primary);
      color: #fff;
      border: 1px solid var(--accent-primary);
      box-shadow: 0 4px 12px rgba(180,0,0,0.3);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      color: #fff;
      text-decoration: none;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(180,0,0,0.45);
    }
    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
      text-decoration: none;
      transform: translateY(-2px);
    }

    /* ============================================================
       POST HERO / INVESTIGATING
    ============================================================ */
    .post-hero {
      padding: 3rem 1.5rem;
      background: linear-gradient(135deg, rgba(var(--bg-primary-rgb),0.5), rgba(180,0,0,0.08));
      border: 1px solid var(--border-color);
      border-radius: 20px;
      margin-bottom: 3rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .investigating-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 50vh;
      flex-direction: column;
      text-align: center;
      margin: 2rem 0;
    }
    .investigating-card {
      background: linear-gradient(135deg, rgba(var(--bg-primary-rgb),0.5), rgba(180,0,0,0.1));
      padding: 4rem 2rem;
      border-radius: 28px;
      border: 1px solid var(--border-color);
      max-width: 560px;
      width: 95%;
    }
    .investigating-card h1 {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-primary);
    }
    .investigating-card p {
      margin-top: 1.5rem;
      color: var(--text-secondary);
      font-size: 1.05rem;
    }
    .pulse-dots { margin-top: 2rem; display: flex; gap: 10px; justify-content: center; }
    .pulse-dot {
      width: 10px; height: 10px;
      background: var(--accent-primary);
      border-radius: 50%;
      animation: dotPulse 1.6s ease-in-out infinite;
      will-change: transform;
    }
    .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
    .pulse-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50%       { transform: scale(1.5); opacity: 1; }
    }

    /* ============================================================
       CARDS
       backdrop-filter solo en dark y solo donde importa visualmente
    ============================================================ */
    .card, .project-card {
      background: rgba(var(--bg-primary-rgb), 0.6);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 2rem;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-align: center;
      will-change: transform;
    }
    [data-theme="dark"] .card,
    [data-theme="dark"] .project-card {
      background: linear-gradient(135deg, rgba(13,17,23,0.7), rgba(180,0,0,0.1));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .card:hover, .project-card:hover {
      border-color: rgba(180,0,0,0.6);
      box-shadow: 0 12px 32px rgba(0,0,0,0.18);
      transform: translateY(-4px);
    }

    .card-date {
      color: var(--text-secondary);
      font-size: 0.88rem;
      margin-bottom: 0.8rem;
      font-weight: 500;
    }
    .card h3 { font-size: 1.2rem; color: var(--text-primary); margin-bottom: 0.6rem; }
    .card h3 a { color: var(--text-primary); }
    .card h3 a:hover { color: var(--accent-primary); text-decoration: none; }
    .card p, .project-card p { color: var(--text-secondary); margin-bottom: 1rem; line-height: 1.6; }

    /* Stretched link */
    .stretched-link::after {
      position: absolute; inset: 0; z-index: 1; content: "";
    }

    /* ============================================================
       TAGS
    ============================================================ */
    .tags, .carousel-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .tag {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      display: inline-block;
    }

    /* ============================================================
       REVEAL ON SCROLL
    ============================================================ */
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      will-change: opacity, transform;
    }
    .reveal.active { opacity: 1; transform: translateY(0); }

    /* ============================================================
       CAROUSEL
    ============================================================ */
    .carousel-section {
      position: relative;
      padding: 5rem 0;
      overflow: hidden;
    }
    .carousel-container {
      position: relative;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 4rem;
      z-index: 5;
    }
    .carousel-wrapper { overflow: hidden; }
    .carousel-track {
      display: flex;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    .carousel-slide {
      flex: 0 0 100%;
      padding: 12px 0.5rem;
    }
    .carousel-card {
      background: rgba(var(--bg-primary-rgb), 0.65);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: transform 0.25s ease, border-color 0.25s ease;
      will-change: transform;
    }
    [data-theme="dark"] .carousel-card {
      background: linear-gradient(135deg, rgba(13,17,23,0.85), rgba(180,0,0,0.2));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }
    .carousel-card:hover {
      transform: translateY(-4px);
      border-color: rgba(180,0,0,0.6);
    }
    .carousel-date {
      color: var(--text-secondary);
      font-size: 0.88rem;
      margin-bottom: 1rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .carousel-card h3 { font-size: 1.4rem; margin-bottom: 0.8rem; color: var(--text-primary); }
    .carousel-card h3 a { color: var(--text-primary); text-decoration: none; }
    .carousel-card h3 a:hover { color: var(--accent-primary); }
    .carousel-card p { color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.6; }

    /* Arrow buttons */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
      will-change: transform;
      line-height: 1;
    }
    .carousel-btn:hover {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #fff;
      transform: translateY(-50%) scale(1.1);
    }
    .carousel-btn-prev { left: 0; }
    .carousel-btn-next { right: 0; }

    /* Dots */
    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }
    .carousel-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border-color);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }
    .carousel-dot.active {
      background: var(--accent-primary);
      transform: scale(1.4);
    }

    /* Glow blobs carousel: solo en dark */
    .carousel-glow { display: none; }
    [data-theme="dark"] .carousel-glow {
      display: block;
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      opacity: 0.3;
      pointer-events: none;
    }
    .carousel-glow-1 { top: -10%; left: -10%; background: rgba(180,0,0,0.6); }
    .carousel-glow-2 { bottom: -10%; right: -10%; background: rgba(100,0,0,0.4); }

    /* ============================================================
       TERMINAL
    ============================================================ */
    .terminal-container {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      margin: 2rem 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      font-family: 'JetBrains Mono', monospace;
    }
    .terminal-header {
      background: #161b22;
      padding: 10px 14px;
      display: flex;
      gap: 7px;
      border-bottom: 1px solid #30363d;
      align-items: center;
    }
    .terminal-dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red    { background: #ff3b30; }
    .dot-yellow { background: #ff9500; }
    .dot-green  { background: #cc0000; }
    .terminal-body { padding: 18px 20px; color: #e6edf3; font-size: 0.9rem; line-height: 1.6; }
    .terminal-line { margin-bottom: 6px; display: flex; gap: 10px; }
    .terminal-prompt  { color: #ff4444; user-select: none; }
    .terminal-command { color: #f0f6fc; }
    .terminal-output  { color: #8b949e; margin-left: 20px; }

    /* ============================================================
       AVATAR
    ============================================================ */
    .neon-text { color: #cc0000; text-shadow: 0 0 5px rgba(200,0,0,0.5); }

    .avatar-container {
      position: relative;
      width: 140px; height: 140px;
      margin: 0 auto 2rem;
    }
    .avatar-img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #cc0000;
      position: relative; z-index: 2;
      animation: avatarPulse 4s ease-in-out infinite;
      will-change: transform;
    }
    .avatar-glow {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      z-index: 1;
      box-shadow: 0 0 20px #cc0000;
      animation: glowPulse 4s ease-in-out infinite;
      will-change: opacity, box-shadow;
    }
    @keyframes avatarPulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.04); }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; box-shadow: 0 0 15px #cc0000; }
      50%       { opacity: 0.9; box-shadow: 0 0 30px #cc0000, 0 0 50px rgba(200,0,0,0.3); }
    }

    /* ============================================================
       SKILLS (sobre-mi)
    ============================================================ */
    .skills-outer-container { max-width: 820px; margin: 3rem auto; padding: 0 1rem; }
    .skills-wrapper {
      padding: 2.5rem 2rem;
      background: rgba(var(--bg-primary-rgb), 0.5);
      border: 1px solid var(--border-color);
      border-radius: 20px;
    }
    [data-theme="dark"] .skills-wrapper {
      background: linear-gradient(135deg, rgba(13,17,23,0.8), rgba(180,0,0,0.15));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .skill-item { margin-bottom: 2rem; position: relative; }
    .skill-info { display: flex; justify-content: space-between; margin-bottom: 0.6rem; }
    .skill-name {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-primary);
      display: flex; align-items: center; gap: 10px;
    }
    .progress-bar-container {
      width: 100%; height: 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 100vw;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #cc0000, #ff4444);
      border-radius: 100vw;
      transition: width 2s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: width;
    }
    .skill-tooltip {
      position: absolute;
      bottom: 24px;
      left: 0;
      background: var(--accent-primary);
      color: #fff;
      padding: 3px 8px;
      border-radius: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, left 2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .skill-tooltip::after {
      content: '';
      position: absolute;
      top: 100%; left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--accent-primary);
    }
    .animate .progress-fill   { width: var(--target-width); }
    .animate .skill-tooltip   { opacity: 1; left: var(--target-width); }

    /* ============================================================
       HIGHLIGHT BOX
    ============================================================ */
    .highlight-box {
      background: var(--highlight-bg);
      border-left: 4px solid var(--accent-primary);
      padding: 1.5rem;
      margin: 2rem 0;
      border-radius: 0 8px 8px 0;
      transition: background-color 0.3s ease;
    }

    /* ============================================================
       TABLES
    ============================================================ */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.95rem;
    }
    th, td {
      padding: 0.8rem 1rem;
      border: 1px solid var(--border-color);
      text-align: left;
      color: var(--text-body);
    }
    th { background: var(--bg-secondary); font-weight: 600; color: var(--text-primary); }
    tr:nth-child(even) { background: rgba(var(--bg-primary-rgb), 0.3); }

    /* ============================================================
       CODE
    ============================================================ */
    code {
      background: var(--bg-secondary);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88em;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    pre {
      background: var(--bg-secondary);
      padding: 1.5rem;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      margin: 1.5rem 0;
    }
    pre code { background: none; padding: 0; border: none; }

    /* ============================================================
       LISTS
    ============================================================ */
    ul, ol { margin: 1rem 0; padding-left: 1.8rem; color: var(--text-secondary); }
    li { margin: 0.4rem 0; line-height: 1.6; }
    li::marker { color: var(--accent-primary); }

    /* ============================================================
       SOCIAL LINKS
    ============================================================ */
    .social-links { display: flex; gap: 1.5rem; }
    .social-links a { color: var(--text-secondary); }
    .social-links a:hover { color: var(--text-primary); }

    .hero-social-link {
      color: var(--text-secondary);
      display: inline-flex;
      transition: color 0.2s ease, transform 0.2s ease, filter 0.2s ease;
      will-change: transform;
    }
    .hero-social-link:hover {
      color: var(--accent-primary);
      transform: translateY(-4px) scale(1.15);
      filter: drop-shadow(0 0 6px var(--accent-primary));
      text-decoration: none;
    }

    /* ============================================================
       FOOTER
    ============================================================ */
    footer {
      background: rgba(var(--bg-primary-rgb), 0.5);
      border-top: 1px solid var(--border-color);
      padding: 3rem 0;
      margin-top: 5rem;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    .footer-content {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .copyright { color: var(--text-secondary); font-size: 0.88rem; text-align: center; }

    /* ============================================================
       LANG TOGGLE (fixed)
    ============================================================ */
    .lang-toggle {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: rgba(var(--bg-primary-rgb), 0.85);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      width: 46px; height: 46px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 1000;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
      will-change: transform;
    }
    .lang-toggle:hover {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
      transform: scale(1.1);
    }

    /* Ocultar widget Google Translate */
    #google_translate_element,
    .skiptranslate,
    .goog-te-banner-frame,
    #goog-gt-tt,
    .goog-te-balloon-frame { display: none !important; }
    body { top: 0 !important; position: static !important; }
    iframe.goog-te-banner-frame { display: none !important; }

    /* ============================================================
       PLATFORM (retos.md)
    ============================================================ */
    .platform-container { margin-bottom: 3rem; position: relative; }
    .platform-header {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      background: rgba(var(--bg-primary-rgb), 0.5);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      will-change: transform;
    }
    .platform-header:hover {
      border-color: var(--accent-primary);
      transform: translateY(-2px);
    }
    .platform-logo {
      width: 52px; height: 52px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid var(--border-color);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .platform-header:hover .platform-logo {
      border-color: var(--accent-primary);
      transform: scale(1.08) rotate(4deg);
    }
    .platform-title {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-primary);
    }
    .branch-line {
      position: absolute;
      top: 52px; left: 22px;
      width: 90px; height: 55px;
      border-left: 2px solid var(--accent-primary);
      border-bottom: 2px solid var(--accent-primary);
      border-bottom-left-radius: 12px;
      opacity: 0;
      pointer-events: none;
      display: none;
    }
    .platform-container.active .branch-line { display: block; opacity: 0.7; }
    .platform-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.45s ease, opacity 0.45s ease, padding 0.45s ease;
      opacity: 0;
    }
    .platform-container.active .platform-content {
      max-height: 3000px;
      padding-left: 100px;
      padding-top: 32px;
      opacity: 1;
    }
    .platform-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: 1.5rem;
    }
    @media (max-width: 600px) {
      .platform-container.active .platform-content { padding-left: 16px; }
      .branch-line { display: none !important; }
    }

    /* ============================================================
       TOR WARNING
    ============================================================ */
    .tor-warning {
      color: #cc0000 !important;
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid #cc0000;
      text-align: center;
      background: rgba(200,0,0,0.05);
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 768px) {
      .hero h1 { font-size: 2rem; }
      .grid { grid-template-columns: 1fr; }
      .carousel-container { padding: 0 3rem; }
      .carousel-btn { width: 38px; height: 38px; font-size: 1.2rem; }
      header .container { flex-direction: column; gap: 0.8rem; padding: 1rem 0.5rem; }
      nav { gap: 0.5rem; }
      .header-actions { width: 100%; justify-content: center; }
      .footer-content { flex-direction: column; text-align: center; }
    }
    @media (max-width: 480px) {
      .carousel-container { padding: 0 2.5rem; }
      .lang-toggle { bottom: 1rem; right: 1rem; width: 40px; height: 40px; }
    }
    @media (min-width: 1800px) {
      html { font-size: 17px; }
      .container { max-width: 1400px; }
    }
  </style>
</head>

<body>
  <!-- Background: solo 2 blobs, sin grid pattern en el body -->
  <div class="bg-glow-container" aria-hidden="true">
    <div class="bg-glow-blob bg-blob-1"></div>
    <div class="bg-glow-blob bg-blob-2"></div>
  </div>

  <div id="google_translate_element"></div>
  <button id="lang-toggle" class="lang-toggle" title="Cambiar idioma" aria-label="Cambiar idioma">ES</button>

  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'es',
        includedLanguages: 'es,en',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <!-- Google Translate cargado de forma no bloqueante -->
  <script defer src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <header>
    <div class="container">
      <div class="logo-group">
        <a href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/img/oso1.png' | relative_url }}" alt="Biel Rosales" class="profile-pic" width="42" height="42" loading="eager">
          <span class="logo">Biel Rosales</span>
        </a>
      </div>
      <nav aria-label="Navegación principal">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/retos' | relative_url }}">Retos</a>
        <a href="{{ '/herramientas' | relative_url }}">Herramientas</a>
        <a href="{{ '/sobre-mi' | relative_url }}">Sobre mí</a>
      </nav>
      <div class="header-actions">
        <div class="system-status" aria-hidden="true">
          <span class="status-dot"></span>
          System Status: Online
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
          <span class="moon-text">DARK</span>
          <span class="sun-text">LIGHT</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer>
    <div class="container">
      <div class="footer-content">
        <div class="copyright">
          © 2026 Biel Rosales — Especialista OSINT &amp; Ciberseguridad
        </div>
      </div>
    </div>
  </footer>

  <script>
    (function() {
      // ── Theme toggle ──────────────────────────────────────────
      var themeToggle = document.getElementById('theme-toggle');
      themeToggle.addEventListener('click', function() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });

      // ── Language toggle ───────────────────────────────────────
      var langToggle = document.getElementById('lang-toggle');
      function getCookie(n) {
        var v = document.cookie.match('(^|;) ?' + n + '=([^;]*)(;|$)');
        return v ? v[2] : null;
      }
      function setCookie(n, v, days) {
        var d = new Date();
        d.setTime(d.getTime() + 24*60*60*1000*days);
        var domain = window.location.hostname.split('.').slice(-2).join('.');
        document.cookie = n+'='+v+';path=/;expires='+d.toGMTString()+';domain=.'+domain;
        document.cookie = n+'='+v+';path=/;expires='+d.toGMTString();
      }
      function updateLangBtn() {
        var gt = getCookie('googtrans');
        langToggle.textContent = (gt && gt.includes('/en')) ? 'EN' : 'ES';
      }
      langToggle.addEventListener('click', function() {
        var gt = getCookie('googtrans');
        if (gt && gt.includes('/en')) {
          var domain = window.location.hostname.split('.').slice(-2).join('.');
          ['','domain=.'+domain,'domain='+window.location.hostname].forEach(function(d){
            document.cookie = 'googtrans=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;'+d;
          });
        } else {
          setCookie('googtrans', '/es/en', 30);
        }
        location.reload();
      });
      updateLangBtn();

      // ── Active nav link ───────────────────────────────────────
      var path = window.location.pathname;
      document.querySelectorAll('nav a').forEach(function(a) {
        try {
          if (new URL(a.href).pathname === path) a.classList.add('active');
        } catch(e) {}
      });

      // ── Reveal on scroll (IntersectionObserver) ───────────────
      var targets = document.querySelectorAll('.card, .project-card, .carousel-container');
      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function(entries) {
          entries.forEach(function(e) {
            if (e.isIntersecting) {
              e.target.classList.add('active');
              io.unobserve(e.target); // unobserve tras animar = ahorra CPU
            }
          });
        }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
        targets.forEach(function(el) {
          el.classList.add('reveal');
          io.observe(el);
        });
      } else {
        // Fallback para navegadores sin IntersectionObserver
        targets.forEach(function(el) { el.classList.add('reveal', 'active'); });
      }
    })();
  </script>
</body>
</html>
